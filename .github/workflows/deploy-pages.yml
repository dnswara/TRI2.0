name: Deploy to GitHub Pages

# Mempublikasikan index.html ke GitHub Pages secara otomatis setiap kali
# ada perubahan yang di-push ke branch ini. Pengguna tidak perlu mengubah
# pengaturan secara manual: langkah "configure-pages" akan mengaktifkan Pages.

on:
  push:
    branches:
      - claude/tri-2-0-assessment-app-uy8nts
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Hanya satu deploy berjalan dalam satu waktu.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare site folder
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
